spring:
  application:
    name: xiaohashu-data-align # 应用名称
  profiles:
    active: dev # 默认激活 dev 本地开发环境
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848 # 指定 Nacos 服务注册中心的服务器地址
        enabled: true # 启用服务发现
        namespace: xiaohashu # 命名空间
        group: DEFAULT_GROUP # 所属组
      config:
        server-addr: 127.0.0.1:8848 # 指定 Nacos 配置中心的服务器地址
        namespace: xiaohashu # 命名空间
        group: DEFAULT_GROUP # 所属组
        prefix: ${spring.application.name} # 配置 Data Id 前缀，这里使用应用名称作为前缀
        file-extension: yaml # 配置文件格式
        refresh-enabled: true # 启用动态刷新
