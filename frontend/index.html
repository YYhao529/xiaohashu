<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff2442">
  <meta name="description" content="小哈书 —— 记录生活，发现同好。">
  <title>小哈书 · 发现你的热爱</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ff2442'/%3E%3Cpath d='M32 47s-14-8.6-14-18a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 9.4-14 18-14 18z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/pages.css">
  <script>
    // 尽早应用已保存的主题，避免深色模式首屏闪白
    try {
      if (localStorage.getItem('xhs:theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (err) {
      /* 隐私模式下忽略 */
    }
  </script>
</head>
<body>
  <a class="skip-link" href="#view">跳到主要内容</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/explore" aria-label="小哈书首页">
        <span class="brand-mark" aria-hidden="true">小</span>
        <span class="brand-name">小哈书</span>
      </a>

      <form class="header-search" id="header-search" role="search" autocomplete="off">
        <label class="sr-only" for="header-search-input">搜索笔记或用户</label>
        <input id="header-search-input" name="q" type="search" placeholder="搜索笔记、用户" enterkeyhint="search">
        <button type="submit" class="header-search-btn" aria-label="搜索">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        </button>
      </form>

      <nav class="header-nav" aria-label="主导航">
        <a class="nav-link" href="#/explore" data-nav="explore">发现</a>
        <a class="nav-link" href="#/search" data-nav="search">搜索</a>
        <a class="btn btn-primary btn-sm nav-publish" href="#/publish" data-nav="publish">发布笔记</a>
        <details class="header-menu" id="header-menu">
          <summary aria-label="打开导航菜单">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
          </summary>
          <div class="header-menu-panel">
            <a href="#/explore" data-nav="explore">发现</a>
            <a href="#/search" data-nav="search">搜索</a>
            <a href="#/publish" data-nav="publish">发布笔记</a>
            <a href="#/me" data-nav="me">我的主页</a>
          </div>
        </details>
        <span class="header-auth" id="auth-slot"></span>
      </nav>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© 2026 小哈书 · 记录你的生活灵感</p>
    </div>
  </footer>

  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <div id="dialog-root"></div>

  <noscript>
    <div class="noscript">小哈书 Web 需要启用 JavaScript 才能运行。</div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
