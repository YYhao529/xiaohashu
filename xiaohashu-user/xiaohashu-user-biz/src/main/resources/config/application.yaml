server:
  port: 8082 # 项目启动的端口

spring:
  servlet:
    multipart:
      # 修改资料上传头像（≤5MB）、背景图（≤8MB），给足余量
      # 不配置时默认只有 1MB，稍大的图片会被 FileSizeLimitExceededException 拒绝
      max-file-size: 10MB
      max-request-size: 15MB

mybatis:
  # MyBatis xml 配置文件路径
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名自动映射下划线
