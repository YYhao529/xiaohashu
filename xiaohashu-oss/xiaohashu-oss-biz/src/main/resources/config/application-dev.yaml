#=================================================================
# 对象存储配置
#=================================================================
storage:
  minio:
    endpoint: http://127.0.0.1:9000
    accessKey: quanxiaoha
    secretKey: quanxiaoha
  aliyun-oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    # 阿里云 AK/SK 从操作系统环境变量读取，不写进仓库
    # Windows: setx OSS_ACCESS_KEY_ID "你的Key"（重新打开终端生效）
    # macOS/Linux: export OSS_ACCESS_KEY_ID="你的Key"
    accessKey: "${OSS_ACCESS_KEY_ID:}"
    secretKey: "${OSS_ACCESS_KEY_SECRET:}"